name: Setup Environment

inputs:
  GITHUB_TOKEN:
    required: true
    description: "GitHub access token used to prevent GitHub's rate limit for unauthenticated requests"

  CACHIX_SIGNING_KEY: # determines what node version to install
    required: true
    description: "Cachix Signing Key"

runs:
  using: "composite"

  steps:
    - name: Setting `USER` for container-based runners
      shell: bash
      run: |
        # Container-based hosted runners leave `USER` unset, which `cachix use`
        # rejects. VM-based runners already export it, so this is a no-op there.
        if [ -z "${USER:-}" ]; then
          echo "USER=$(id -un 2>/dev/null || echo root)" >> "$GITHUB_ENV"
        fi

    - name: Installing Nix
      uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixpkgs-unstable
        extra_nix_config: |
          access-tokens = github.com=${{ inputs.GITHUB_TOKEN }}

    - uses: cachix/cachix-action@v15
      with:
        name: nixos-search
        signingKey: "${{ inputs.CACHIX_SIGNING_KEY }}"
