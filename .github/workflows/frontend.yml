name: "Frontend: Build & Deploy to Netlify"

on:
  workflow_dispatch:

  # The icon and screenshot assets are written from the index at deploy time, so a
  # deploy is what picks up whatever the imports have added since the last one.
  schedule:
    - cron: "0 5 * * *"

  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "frontend/**"
      - "version.nix"

  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out the repository
        uses: actions/checkout@v7.0.1

      - name: Setup
        uses: ./.github/actions/common-setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Building search.nixos.org
        shell: sh
        run: |
          nix -vL build .#frontend
          mkdir ./dist
          cp -RL ./result/* ./dist/

      - name: Build autocomplete corpus
        shell: sh
        env:
          AUTOCOMPLETE_OUT_DIR: ../dist/autocomplete
        run: |
          NIXOS_CHANNELS=$(cat $(nix build --no-link --print-out-paths .#nixosChannelsJson))
          export NIXOS_CHANNELS
          ELASTICSEARCH_MAPPING_SCHEMA_VERSION=$(nix eval --raw --impure --expr '(import ./version.nix).frontend')
          export ELASTICSEARCH_MAPPING_SCHEMA_VERSION
          npm --prefix frontend run build:autocomplete

      - name: Build icon assets
        shell: sh
        env:
          ICONS_OUT_DIR: ../dist/icons
        run: |
          ELASTICSEARCH_MAPPING_SCHEMA_VERSION=$(nix eval --raw --impure --expr '(import ./version.nix).frontend')
          export ELASTICSEARCH_MAPPING_SCHEMA_VERSION
          npm --prefix frontend run build:icons

      - name: Build screenshot assets
        shell: sh
        env:
          SCREENSHOTS_OUT_DIR: ../dist/screenshots
        run: |
          ELASTICSEARCH_MAPPING_SCHEMA_VERSION=$(nix eval --raw --impure --expr '(import ./version.nix).frontend')
          export ELASTICSEARCH_MAPPING_SCHEMA_VERSION
          npm --prefix frontend run build:screenshots

      # The Netlify CLI also uploads the edge functions in
      # `frontend/netlify/edge-functions`. It finds them and `netlify.toml`
      # from its working directory.
      - name: Deploy to Netlify
        id: deploy
        if: github.repository_owner == 'NixOS'
        working-directory: frontend
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PRODUCTION: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          # A pull request from a fork gets no secrets, thus it gets no deploy.
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "No Netlify credentials, thus no deploy."
            exit 0
          fi
          args=(deploy --no-build --dir ../dist --message "Deploy from GitHub Actions" --json)
          if [ "$PRODUCTION" = true ]; then
            args+=(--prod)
          fi
          nix shell --inputs-from .. nixpkgs#netlify-cli nixpkgs#deno -c netlify "${args[@]}" > ../deploy.json
          if [ "$PRODUCTION" = true ]; then
            echo "url=$(jq -r .url ../deploy.json)" >> "$GITHUB_OUTPUT"
          else
            echo "url=$(jq -r .deploy_url ../deploy.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set the commit status
        if: steps.deploy.outputs.url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=Netlify -f description="Netlify deployment" -f target_url="$URL"

      - name: Comment the deploy URL on the pull request
        if: steps.deploy.outputs.url != '' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Change the comment of an earlier deploy, if there is one.
          body="<!-- NETLIFY DEPLOY COMMENT -->
          Deployed on $URL"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | contains("NETLIFY DEPLOY COMMENT")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
          fi
