name: "Frontend: Check"

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/check-frontend.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run elm-test
        run: npm test
        working-directory: frontend

      - name: Run elm-review
        run: npm run review
        working-directory: frontend
